apply plugin: 'com.android.library'

group = 'com.extrachill.gutenbergkiteditor'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(':expo-modules-core').projectDir.absolutePath, 'ExpoModulesCorePlugin.gradle')
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()
useDefaultAndroidSdkVersions()

android {
  namespace 'com.extrachill.gutenbergkiteditor'

  defaultConfig {
    minSdkVersion 24
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  implementation 'org.wordpress.gutenbergkit:android:v0.19.0'
}
